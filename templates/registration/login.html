{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Mastitrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body style="background-color: #f5f3f0;">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card shadow login-card">
                    <div class="card-body p-4">
                        <div class="text-center mb-3">
                            <img src="{% static 'img/logo_placeholder.png' %}" alt="Mastitrack" style="max-height: 48px;">
                        </div>
                        <h3 class="card-title text-center mb-4 login-brand">Mastitrack</h3>
                        {% if form.errors %}
                        <div class="alert alert-danger">Usuario o contrasena incorrectos.</div>
                        {% endif %}
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_username" class="form-label">Usuario</label>
                                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="id_password" class="form-label">Contrasena</label>
                                <input type="password" name="password" id="id_password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
