{% load static %}
<nav class="navbar navbar-expand-lg navbar-mastitrack">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard' %}">
            <!-- Logo horizontal: reemplazar logo_placeholder.png por el logo definitivo -->
            <img src="{% static 'img/logo_placeholder.png' %}" alt="Mastitrack" class="navbar-logo">
            Mastitrack
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            {% if user.is_authenticated %}
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'vacas:lista' %}">Vacas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'bitacora:lista' %}">Bitacora</a>
                </li>
                {% if puede_gestionar %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'semaforo:panel' %}">Semaforo</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'calculadora:panel' %}">Calculadora</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'calculadora:admin_parametros' %}">Parametros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'usuarios:lista' %}">Usuarios</a>
                </li>
                {% endif %}
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item d-flex align-items-center">
                    <span class="badge badge-rol badge-rol-{{ rol_usuario }} me-2">{{ rol_usuario }}</span>
                    <span class="nav-link nav-user">{{ user.username }}</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'logout' %}">Salir</a>
                </li>
            </ul>
            {% endif %}
        </div>
    </div>
</nav>
