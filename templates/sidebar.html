{% load static %}
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <img src="{% static 'img/mastitrack_logo.png' %}" alt="Mastitrack" class="sidebar-logo" id="sidebar-logo">
        <span class="sidebar-brand" id="sidebar-brand">Mastitrack</span>
        <button class="sidebar-toggle" id="sidebar-toggle" title="Contraer menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'dashboard' %}" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
            </svg>
            <span class="sidebar-link-text">Dashboard</span>
        </a>

        <a href="{% url 'vacas:lista' %}" class="sidebar-link {% if '/vacas/' in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12c0-3.9 3.1-7 7-7s7 3.1 7 7v3c0 2.8-2.2 5-5 5h-4c-2.8 0-5-2.2-5-5z"/>
                <path d="M9 5C8 2 6 2 6.5 4"/>
                <path d="M15 5c1-3 3-3 2.5-1"/>
                <path d="M5 11c-2-2-3 0-1.5 1.5"/>
                <path d="M19 11c2-2 3 0 1.5 1.5"/>
                <circle cx="10" cy="12" r="0.5" fill="currentColor" stroke="none"/>
                <circle cx="14" cy="12" r="0.5" fill="currentColor" stroke="none"/>
                <ellipse cx="12" cy="17" rx="3" ry="2"/>
                <circle cx="10.5" cy="17" r="1"/>
                <circle cx="13.5" cy="17" r="1"/>
            </svg>
            <span class="sidebar-link-text">Vacas</span>
        </a>

        <a href="{% url 'bitacora:lista' %}" class="sidebar-link {% if '/bitacora/' in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span class="sidebar-link-text">Bitacora</span>
        </a>

        {% if puede_gestionar %}
        <div class="sidebar-divider"></div>
        <span class="sidebar-section-title">Gestion</span>

        <a href="{% url 'semaforo:panel' %}" class="sidebar-link {% if '/semaforo/' in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <span class="sidebar-link-text">Semaforo</span>
        </a>

        <a href="{% url 'calculadora:panel' %}" class="sidebar-link {% if '/calculadora/' in request.path and 'parametros' not in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            <span class="sidebar-link-text">Calculadora</span>
        </a>

        <div class="sidebar-divider"></div>
        <span class="sidebar-section-title">Configuracion</span>

        <a href="{% url 'calculadora:admin_parametros' %}" class="sidebar-link {% if 'parametros' in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
            </svg>
            <span class="sidebar-link-text">Parametros</span>
        </a>

        <a href="{% url 'entrenamiento:panel' %}" class="sidebar-link {% if '/entrenamiento/' in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
            <span class="sidebar-link-text">Entrenamiento</span>
        </a>

        <a href="{% url 'usuarios:lista' %}" class="sidebar-link {% if '/usuarios/' in request.path %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 00-3-3.87"></path>
                <path d="M16 3.13a4 4 0 010 7.75"></path>
            </svg>
            <span class="sidebar-link-text">Usuarios</span>
        </a>
        {% endif %}
    </nav>

    <div class="sidebar-about">
        <a href="{% url 'acerca' %}" class="sidebar-link {% if request.path == '/acerca/' %}active{% endif %}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span class="sidebar-link-text">Acerca de</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <span class="badge badge-rol badge-rol-{{ rol_usuario }} sidebar-badge-collapsible" id="sidebar-badge">{{ rol_usuario }}</span>
            <span class="sidebar-username">{{ user.username }}</span>
        </div>
        <a href="{% url 'logout' %}" class="sidebar-link sidebar-logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="sidebar-link-text">Salir</span>
        </a>
    </div>
</aside>

<div class="sidebar-overlay" id="sidebar-overlay"></div>
